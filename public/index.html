<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenPix 🎨</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface-2: #1e1e1e;
      --border: #2a2a2a;
      --text: #e5e5e5;
      --text-dim: #888;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --success: #22c55e;
      --error: #ef4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-dim);
      font-size: 0.95rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      margin-bottom: 16px;
    }

    .input-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row > * { flex: 1; }

    button {
      width: 100%;
      padding: 12px 24px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .status {
      text-align: center;
      padding: 12px;
      font-size: 0.9rem;
      color: var(--text-dim);
      display: none;
    }

    .status.error { color: var(--error); display: block; }

    .gallery {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-top: 24px;
    }

    .gallery img {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .api-key-saved {
      color: var(--success);
      font-size: 0.8rem;
      margin-top: 4px;
    }

    .footer {
      text-align: center;
      margin-top: 40px;
      color: var(--text-dim);
      font-size: 0.8rem;
    }

    .footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎨 OpenPix</h1>
      <p>Generate images with AI via OpenRouter</p>
    </header>

    <!-- API Key -->
    <div class="card">
      <h2>🔑 API Key</h2>
      <div class="input-group">
        <label for="apiKey">OpenRouter API Key</label>
        <input type="password" id="apiKey" placeholder="sk-or-..." />
        <div id="keyStatus" class="api-key-saved"></div>
      </div>
    </div>

    <!-- Generate -->
    <div class="card">
      <h2>🖼️ Generate</h2>
      <div class="row" style="margin-bottom:16px;">
        <div class="input-group" style="margin-bottom:0">
          <label for="model">Model</label>
          <select id="model"></select>
        </div>
        <div class="input-group" style="margin-bottom:0">
          <label for="size">Size</label>
          <select id="size">
            <option value="1024x1024">1024 × 1024</option>
            <option value="512x512">512 × 512</option>
            <option value="256x256">256 × 256</option>
          </select>
        </div>
      </div>
      <div class="input-group">
        <label for="prompt">Prompt</label>
        <textarea id="prompt" placeholder="Describe the image you want to generate..."></textarea>
      </div>
      <button id="generateBtn" onclick="generate()">Generate</button>
    </div>

    <div id="status" class="status"></div>

    <!-- Result -->
    <div id="gallery" class="gallery"></div>

    <div class="footer">
      Powered by <a href="https://openrouter.ai" target="_blank">OpenRouter</a> ·
      <a href="https://github.com/JayLyu/openpix" target="_blank">GitHub</a>
    </div>
  </div>

  <script>
    const LS_KEY = 'openpix_api_key';

    // Load saved API key
    const savedKey = localStorage.getItem(LS_KEY);
    if (savedKey) {
      document.getElementById('apiKey').value = savedKey;
      document.getElementById('keyStatus').textContent = '✓ Key loaded from local storage';
    }

    // Save key on change
    document.getElementById('apiKey').addEventListener('change', (e) => {
      const val = e.target.value.trim();
      if (val) {
        localStorage.setItem(LS_KEY, val);
        document.getElementById('keyStatus').textContent = '✓ Key saved to local storage';
      } else {
        localStorage.removeItem(LS_KEY);
        document.getElementById('keyStatus').textContent = '';
      }
    });

    // Load models
    async function loadModels() {
      try {
        const res = await fetch('/api/models');
        const data = await res.json();
        const sel = document.getElementById('model');
        sel.innerHTML = '';
        data.models.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = `${m.name} (${m.provider})`;
          sel.appendChild(opt);
        });
      } catch {
        // Fallback
        document.getElementById('model').innerHTML =
          '<option value="openai/gpt-image-2">GPT Image 2 (OpenAI)</option>';
      }
    }
    loadModels();

    // Generate
    async function generate() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const model = document.getElementById('model').value;
      const prompt = document.getElementById('prompt').value.trim();
      const size = document.getElementById('size').value;
      const statusEl = document.getElementById('status');
      const gallery = document.getElementById('gallery');
      const btn = document.getElementById('generateBtn');

      if (!apiKey) { statusEl.textContent = 'Please enter your API key'; statusEl.className = 'status error'; return; }
      if (!prompt) { statusEl.textContent = 'Please enter a prompt'; statusEl.className = 'status error'; return; }

      btn.disabled = true;
      btn.textContent = 'Generating...';
      statusEl.textContent = 'Generating image...';
      statusEl.className = 'status';
      statusEl.style.display = 'block';

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ apiKey, model, prompt, size, n: 1 }),
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Generation failed');
        }

        gallery.innerHTML = '';
        if (data.data) {
          data.data.forEach(item => {
            if (item.url) {
              const img = document.createElement('img');
              img.src = item.url;
              img.alt = prompt;
              gallery.appendChild(img);
            } else if (item.b64_json) {
              const img = document.createElement('img');
              img.src = `data:image/png;base64,${item.b64_json}`;
              img.alt = prompt;
              gallery.appendChild(img);
            }
          });
        }

        statusEl.textContent = '';
        statusEl.style.display = 'none';
      } catch (err) {
        statusEl.textContent = err.message;
        statusEl.className = 'status error';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Generate';
      }
    }
  </script>
</body>
</html>
